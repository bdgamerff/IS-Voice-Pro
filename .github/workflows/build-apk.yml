
name: Build IS Voice Pro APK

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Build APK
        run: |
          sdkmanager "platforms;android-35" "build-tools;35.0.0"
          unzip -q IS-Voice-Pro-Android-Starter.zip -d source
          cd source/is-voice-pro
          gradle assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: IS-Voice-Pro-APK
          path: source/is-voice-pro/app/build/outputs/apk/debug/app-debug.apk
